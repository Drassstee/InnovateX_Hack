<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Inspector - PDF Analysis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .upload-section {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            background: #f8f9ff;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 4em;
            margin-bottom: 20px;
            color: #667eea;
        }

        .upload-text {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 10px;
        }

        .upload-hint {
            color: #666;
            font-size: 0.9em;
        }

        #fileInput {
            display: none;
        }

        .upload-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .upload-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .upload-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .progress-section {
            display: none;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .status-message {
            text-align: center;
            font-size: 1.1em;
            color: #333;
            margin-top: 10px;
        }

        .results-section {
            display: none;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .results-title {
            font-size: 1.5em;
            color: #333;
        }

        .summary {
            color: #666;
            font-size: 0.9em;
        }

        .image-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .image-card {
            border: 2px solid #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            background: white;
        }

        .image-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .image-container {
            position: relative;
            width: 100%;
            padding-top: 75%; /* 4:3 aspect ratio */
            overflow: hidden;
            background: #f5f5f5;
        }

        .image-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            cursor: pointer;
        }

        .image-info {
            padding: 15px;
            background: #f8f9ff;
        }

        .image-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .image-page {
            color: #666;
            font-size: 0.9em;
        }

        .error-message {
            background: #fee;
            border: 2px solid #fcc;
            border-radius: 10px;
            padding: 20px;
            color: #c33;
            margin: 20px 0;
            display: none;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            overflow: auto;
        }

        .modal-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 90%;
            margin-top: 50px;
        }

        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: #fff;
        }

        @media (max-width: 768px) {
            .image-gallery {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Digital Inspector</h1>
            <p>Upload a PDF to detect signatures, stamps, and QR codes</p>
        </div>

        <div class="upload-section">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📄</div>
                <div class="upload-text">Drag & drop your PDF here</div>
                <div class="upload-hint">or click to browse</div>
                <input type="file" id="fileInput" accept=".pdf">
            </div>
            <div style="text-align: center; margin-top: 20px;">
                <button class="upload-button" id="uploadButton" disabled>Process PDF</button>
            </div>
        </div>

        <div class="progress-section" id="progressSection">
            <div class="status-message" id="statusMessage">Processing PDF...</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill">0%</div>
            </div>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="results-section" id="resultsSection">
            <div class="results-header">
                <div>
                    <div class="results-title">Detected Images</div>
                    <div class="summary" id="summaryText"></div>
                </div>
            </div>
            <div class="image-gallery" id="imageGallery"></div>
        </div>
    </div>

    <!-- Image Modal -->
    <div id="imageModal" class="modal">
        <span class="close">&times;</span>
        <img class="modal-content" id="modalImage">
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const uploadButton = document.getElementById('uploadButton');
        const progressSection = document.getElementById('progressSection');
        const progressFill = document.getElementById('progressFill');
        const statusMessage = document.getElementById('statusMessage');
        const errorMessage = document.getElementById('errorMessage');
        const resultsSection = document.getElementById('resultsSection');
        const imageGallery = document.getElementById('imageGallery');
        const summaryText = document.getElementById('summaryText');
        const modal = document.getElementById('imageModal');
        const modalImage = document.getElementById('modalImage');
        const closeModal = document.querySelector('.close');

        let selectedFile = null;

        // Upload area click
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // File input change
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                uploadButton.disabled = false;
                uploadArea.querySelector('.upload-text').textContent = `Selected: ${selectedFile.name}`;
            }
        });

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            if (e.dataTransfer.files.length > 0) {
                const file = e.dataTransfer.files[0];
                if (file.type === 'application/pdf') {
                    selectedFile = file;
                    fileInput.files = e.dataTransfer.files;
                    uploadButton.disabled = false;
                    uploadArea.querySelector('.upload-text').textContent = `Selected: ${selectedFile.name}`;
                } else {
                    showError('Please select a PDF file.');
                }
            }
        });

        // Upload button click
        uploadButton.addEventListener('click', async () => {
            if (!selectedFile) {
                showError('Please select a file first.');
                return;
            }

            await processPDF(selectedFile);
        });

        async function processPDF(file) {
            // Reset UI
            hideError();
            resultsSection.style.display = 'none';
            progressSection.style.display = 'block';
            uploadButton.disabled = true;
            progressFill.style.width = '0%';
            progressFill.textContent = '0%';
            statusMessage.textContent = 'Uploading PDF...';

            const formData = new FormData();
            formData.append('file', file);

            let progressInterval;
            let timeoutId;

            try {
                // Simulate progress
                progressInterval = simulateProgress();

                // Add timeout (5 minutes for large PDFs)
                timeoutId = setTimeout(() => {
                    clearInterval(progressInterval);
                    throw new Error('Request timeout. The PDF might be too large or processing is taking too long.');
                }, 300000); // 5 minutes

                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                clearTimeout(timeoutId);
                clearInterval(progressInterval);

                // Check if response is ok before parsing JSON
                let data;
                try {
                    data = await response.json();
                } catch (e) {
                    throw new Error('Invalid response from server. Check server console for errors.');
                }

                if (!response.ok) {
                    throw new Error(data.error || `Server error: ${response.status}`);
                }

                // Show results
                progressFill.style.width = '100%';
                progressFill.textContent = '100%';
                statusMessage.textContent = 'Processing complete!';

                setTimeout(() => {
                    displayResults(data);
                }, 500);

            } catch (error) {
                clearTimeout(timeoutId);
                if (progressInterval) clearInterval(progressInterval);
                
                console.error('Error processing PDF:', error);
                showError(error.message || 'An error occurred. Check the browser console and server logs for details.');
                progressSection.style.display = 'none';
                uploadButton.disabled = false;
            }
        }

        function simulateProgress() {
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 10;
                if (progress > 95) {
                    progress = 95; // Stop at 95% and wait for actual response
                }
                progressFill.style.width = progress + '%';
                progressFill.textContent = Math.round(progress) + '%';
                
                // Update status message based on progress
                if (progress < 30) {
                    statusMessage.textContent = 'Uploading PDF...';
                } else if (progress < 60) {
                    statusMessage.textContent = 'Converting PDF to images...';
                } else if (progress < 90) {
                    statusMessage.textContent = 'Detecting signatures, stamps, and QR codes...';
                } else {
                    statusMessage.textContent = 'Finalizing results...';
                }
            }, 300);
            return interval;
        }

        function displayResults(data) {
            progressSection.style.display = 'none';
            resultsSection.style.display = 'block';
            
            const summary = data.summary;
            summaryText.textContent = `${summary.total_pages} page(s) processed, ${summary.total_annotations} detection(s) found`;

            imageGallery.innerHTML = '';

            if (data.images && data.images.length > 0) {
                data.images.forEach((img, index) => {
                    const card = document.createElement('div');
                    card.className = 'image-card';
                    card.innerHTML = `
                        <div class="image-container">
                            <img src="${img.url}" alt="${img.name}" loading="lazy" onclick="openModal('${img.url}')">
                        </div>
                        <div class="image-info">
                            <div class="image-name">${img.name}</div>
                            <div class="image-page">Page: ${img.page}</div>
                        </div>
                    `;
                    imageGallery.appendChild(card);
                });
            } else {
                imageGallery.innerHTML = '<p style="text-align: center; color: #666; padding: 40px;">No detections found in this PDF.</p>';
            }
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        function hideError() {
            errorMessage.style.display = 'none';
        }

        // Modal functionality
        function openModal(imageUrl) {
            modal.style.display = 'block';
            modalImage.src = imageUrl;
        }

        closeModal.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
